name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build example Wasm plugin
        run: cargo build -p cadenza-linear-graphql-plugin --target wasm32-wasip2 --release
      - name: Install wasm-tools
        run: cargo install --locked wasm-tools
      - name: Check WIT ABI
        run: ./scripts/check-wit-abi.sh

  codex-schema-gate:
    runs-on: ubuntu-latest
    if: false # Enable after pinning a Codex CLI version in tools/versions.toml.
    steps:
      - uses: actions/checkout@v4
      - name: Generate Codex schema and compare hash
        run: ./scripts/codex-schema.sh --check
