name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Rust toolchain from ledger
        run: |
          set -euo pipefail
          v=$(awk -F'"' '/^toolchain_version[[:space:]]*=/{print $2; exit}' tools/versions.toml)
          [ -n "$v" ] || { echo "toolchain_version missing in tools/versions.toml" >&2; exit 1; }
          echo "RUST_TOOLCHAIN=$v" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - name: MVP smoke (mock loop)
        run: ./scripts/mvp-smoke.sh
      - name: Build example Wasm plugin
        run: cargo build --locked -p cadenza-linear-graphql-plugin --target wasm32-wasip2 --release
      - name: Install wasm-tools
        run: cargo install --locked wasm-tools
      - name: Check WIT ABI
        run: ./scripts/check-wit-abi.sh

  codex-schema-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install codex CLI (pinned via tools/versions.toml)
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^cli_version[[:space:]]*=/{print $2; exit}' tools/versions.toml)
          if [ -z "$version" ]; then
            echo "could not read codex.cli_version from tools/versions.toml" >&2
            exit 1
          fi
          asset="codex-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/openai/codex/releases/download/${version}/${asset}"
          echo "Installing codex $version from $url"
          tmp="$(mktemp -d)"
          curl --fail --location --silent --show-error "$url" -o "$tmp/codex.tar.gz"
          tar -xzf "$tmp/codex.tar.gz" -C "$tmp"
          bin=$(find "$tmp" -type f -name 'codex*' ! -name '*.tar*' ! -name '*.sigstore' -perm -u+x | head -n1)
          if [ -z "$bin" ]; then
            echo "could not locate codex binary inside $asset:" >&2
            tar -tzf "$tmp/codex.tar.gz" | head -20 >&2
            exit 1
          fi
          sudo install -m 0755 "$bin" /usr/local/bin/codex
          codex --version
      - name: Generate Codex schema and compare hash
        run: ./scripts/codex-schema.sh --check
