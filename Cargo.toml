[workspace]
resolver = "2"
members = [
  "crates/cadenza-cli",
  "crates/cadenza-core",
  "crates/cadenza-workflow",
  "crates/cadenza-workspace",
  "crates/cadenza-orchestrator",
  "crates/cadenza-codex",
  "crates/cadenza-tracker-linear",
  "crates/cadenza-wasm-host",
  "crates/cadenza-obs",
  "plugins/cadenza-linear-graphql-plugin",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"
authors = ["Cadenza contributors"]
repository = "https://github.com/bytevane/cadenza"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive", "env"] }
minijinja = { version = "2", features = ["loader", "json"] }
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
wasmtime = { version = "45", features = ["async", "component-model"] }
wasmtime-wasi = "45"
wasmtime-wasi-http = "45"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
