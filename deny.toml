# Optional cargo-deny baseline. Enable in CI after the initial dependency graph is frozen.
[licenses]
unlicensed = "deny"
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"

[advisories]
yanked = "warn"
ignore = []
