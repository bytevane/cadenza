[package]
name = "cadenza-host-linear-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
cadenza-wasm-host = { path = "../cadenza-wasm-host" }
# `blocking`: `LinearTransport::execute` is synchronous and runs on a detached
# std::thread (ADR 0007), so we use reqwest's self-contained blocking client.
# `http2`: the workspace pin sets `default-features = false`, dropping the
# otherwise-default `http2`; re-enable it so ALPN negotiates h2 (ADR 0008).
reqwest = { workspace = true, features = ["blocking", "http2"] }
serde_json.workspace = true
