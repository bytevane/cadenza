[package]
name = "cadenza-wasm-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
camino.workspace = true
cadenza-obs = { path = "../cadenza-obs" }
cadenza-workspace = { path = "../cadenza-workspace" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wasmtime-wasi-http.workspace = true
wasmparser.workspace = true

[dev-dependencies]
tempfile = "3"
# WAT → component-binary encoder used by `capabilities` unit tests to drive the
# wasmparser-based core-instance counter against hand-written components
# (issue #86). Version matches `wasm-tools` already in the lockfile so no
# additional copy enters the build.
wat = "1.250"
