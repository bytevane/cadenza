[package]
name = "cadenza-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "cadenza"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
cadenza-core = { path = "../cadenza-core" }
cadenza-workflow = { path = "../cadenza-workflow" }
cadenza-workspace = { path = "../cadenza-workspace" }
camino.workspace = true
clap.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
async-trait.workspace = true
cadenza-codex = { path = "../cadenza-codex" }
cadenza-obs = { path = "../cadenza-obs" }
cadenza-orchestrator = { path = "../cadenza-orchestrator" }
cadenza-tracker-linear = { path = "../cadenza-tracker-linear" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
